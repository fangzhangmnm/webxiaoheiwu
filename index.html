    <script>
      // bundle 加载前的兜底：任何脚本错误糊一张红条（Quest 无 devtools）。bundle 就绪后 error-badge 接管 __xhw_showFatal。
      (function () {
        function show(text) {
          var bar = document.getElementById("errBanner");
          if (!bar) {
            bar = document.createElement("div");
            bar.id = "errBanner"; bar.className = "err-banner";
            bar.addEventListener("click", function () { bar.classList.add("hidden"); });
            (document.body || document.documentElement).appendChild(bar);
          }
          bar.classList.remove("hidden", "warning");
          bar.textContent = text + "  (点击关闭)";
        }
        window.__xhw_showFatal = show;
        window.addEventListener("error", function (e) {
          if (window.__xhw_showFatal !== show) return;
          var m = (e && e.message) || "脚本错误";
          var src = e && e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : "";
          show(m + src);
        });
        window.addEventListener("unhandledrejection", function (e) {
          if (window.__xhw_showFatal !== show) return;
          var r = e && e.reason; show((r && r.message) || String(r || "promise rejection"));
        });
      })();
    </script>

    <main class="surface" aria-label="网页版小黑屋" data-i18n-aria="ui.appTitle">
      <header class="top-bar">
        <button class="menu-button" id="menuButton" type="button" aria-label="文件菜单" data-i18n-aria="ui.menu" data-i18n-title="ui.menu">
          <svg class="ico" aria-hidden="true"><use href="#menu"/></svg>
        </button>
        <input id="titleInput" type="text" class="title" placeholder="无标题" data-i18n-ph="ui.titlePlaceholder" data-i18n-aria="ui.titleAria"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="文档标题" data-i18n-aria="ui.titleAria" />
        <button class="crypto-toggle" id="cryptoToggle" type="button" hidden aria-label="加密文档" data-i18n-aria="top.encryptDoc"></button>
        <button class="lock-toggle" id="lockToggle" type="button" hidden aria-label="只读保护" data-i18n-aria="top.readOnlyOn"></button>
        <div class="status" aria-live="polite">
          <span id="wordCount">0 字</span>
          <span class="sep" aria-hidden="true">·</span>
          <span id="saveStatus">就绪</span>
          <span class="sep" aria-hidden="true">·</span>
          <span id="imeStatus" role="button" tabindex="0">系统输入法</span>
        </div>
      </header>

      <div class="ghost-banner key-banner" id="keyBanner" hidden>
        <span data-i18n="ui.key.otherPw">这篇用的不是当前密码（保存仍用它自己的密码）</span>
        <button class="auth-action" id="rekeyButton" type="button" data-i18n="ui.key.rekey">换成当前密码</button>
      </div>
      <article class="page">
        <label class="sr-only" for="editor" data-i18n="ui.editorAria">小说编辑区</label>
        <textarea id="editor" class="body" spellcheck="false" autocorrect="off" autocomplete="off" autocapitalize="off"></textarea>
        <button id="micButton" class="mic-button" type="button" hidden aria-label="语音输入" data-i18n-aria="ui.mic" data-state="idle">
          <svg class="mic-icon ico" aria-hidden="true"><use href="#microphone"/></svg>
          <span class="mic-pulse" aria-hidden="true"></span>
        </button>
        <div id="candidateBar" class="candidates hidden" aria-live="polite"></div>
      </article>
    </main>

    <div id="idleOverlay" class="idle-overlay hidden" role="dialog" aria-label="已闲置" data-i18n-aria="ui.idleAria">
      <div class="idle-card">
        <p class="idle-title" data-i18n="ui.idleTitle">已闲置一段时间</p>
        <p class="idle-hint" data-i18n="ui.idleHint">点击任意位置同步云端最新版并继续编辑</p>
      </div>
    </div>

    <div id="busyOverlay" class="idle-overlay busy-overlay hidden" role="dialog" aria-modal="true" aria-label="处理中" data-i18n-aria="ui.busyAria">
      <div class="idle-card">
        <p class="idle-title" id="busyOverlayText" data-i18n="ui.busy">处理中…</p>
        <p class="idle-hint" id="busyOverlayHint" data-i18n="ui.busyHint">请稍候</p>
      </div>
    </div>

    <div id="updateToast" class="update-toast hidden" role="status" aria-live="polite">
      <span class="update-text" data-i18n="ui.updateText">有新版本</span>
      <button class="update-reload" id="updateReloadButton" type="button" data-i18n="ui.updateReload">刷新</button>
      <button class="update-dismiss" id="updateDismissButton" type="button" aria-label="忽略" data-i18n-aria="ui.updateDismiss">
        <svg class="ico" aria-hidden="true"><use href="#x"/></svg>
      </button>
    </div>

    <!-- 通用 sheet（确认 / 输入 / 多选）——沿用 v1 密码框的视觉（crypto-modal 系） -->
    <div id="sheet" class="crypto-modal hidden" role="dialog" aria-modal="true">
      <div class="crypto-card" id="sheetCard">
        <h3 class="crypto-title" id="sheetTitle"></h3>
        <p class="crypto-hint hidden" id="sheetMessage"></p>
        <input id="sheetInput" class="crypto-input hidden" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
        <input id="sheetInput2" class="crypto-input hidden" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="再次输入以确认" data-i18n-ph="ui.sheetInput2Ph" />
        <p id="sheetError" class="crypto-error hidden"></p>
        <div id="sheetChoices" class="sheet-choices hidden"></div>
        <div class="crypto-actions">
          <button id="sheetCancel" class="crypto-button" type="button">取消</button>
          <button id="sheetConfirm" class="crypto-button primary" type="button">确定</button>
        </div>
      </div>
    </div>

    <!-- sync gate（冲突 / 跳过到离线）：锁屏 + 有限选项，不可 dismiss，压在 busy 之上 -->
    <div id="gateSheet" class="idle-overlay gate-sheet hidden" role="dialog" aria-modal="true">
      <div class="idle-card gate-card">
        <p class="idle-title" id="gateTitle"></p>
        <p class="idle-hint" id="gateMessage"></p>
        <div class="gate-spinner hidden" id="gateSpinner" aria-hidden="true"></div>
        <div class="gate-actions" id="gateActions"></div>
        <p class="gate-note hidden" id="gateNote"></p>
      </div>
    </div>

    <div id="drawerBackdrop" class="backdrop hidden" aria-hidden="true"></div>
    <aside id="drawer" class="drawer hidden" aria-hidden="true" aria-label="文件管理">
      <header class="drawer-header">
        <button class="icon-button drawer-back" id="drawerBackButton" type="button" aria-label="返回" data-i18n-aria="ui.drawerBack" hidden>
          <svg class="ico" aria-hidden="true"><use href="#back"/></svg>
        </button>
        <h2 id="drawerTitle">文件</h2>
        <button class="icon-button" id="reloadButton" type="button" aria-label="刷新页面" data-i18n-aria="ui.drawerReload" data-i18n-title="ui.drawerReload">
          <svg class="ico" aria-hidden="true"><use href="#refresh"/></svg>
        </button>
        <button class="icon-button" id="drawerCloseButton" type="button" aria-label="关闭" data-i18n-aria="ui.drawerClose">
          <svg class="ico" aria-hidden="true"><use href="#x"/></svg>
        </button>
      </header>

      <div class="settings-view" id="settingsView" hidden>
        <section class="settings-section is-flat">
          <h3 class="settings-section-title" data-i18n="ui.sec.account">账号</h3>
          <div class="auth-row" id="authRow"></div>
        </section>

        <section class="settings-section is-flat">
          <h3 class="settings-section-title" data-i18n="ui.sec.language">界面语言</h3>
          <select id="langSelect" class="voice-config-select"></select>
        </section>

        <section class="settings-section is-flat" id="readingModeSection">
          <h3 class="settings-section-title" data-i18n="ui.sec.reading">阅读节奏</h3>
          <div class="reading-mode-picker" id="readingModePicker" role="radiogroup">
            <label class="reading-mode-option is-selected" data-mode="novel">
              <input type="radio" name="readingMode" value="novel" checked />
              <span data-i18n="ui.reading.novel">轻小说 · 短行</span>
            </label>
            <label class="reading-mode-option" data-mode="classic">
              <input type="radio" name="readingMode" value="classic" />
              <span data-i18n="ui.reading.classic">标准 · 宽行</span>
            </label>
          </div>
          <p class="reading-mode-hint" data-i18n="ui.reading.hint">短行模式收窄页面、撑开行距，逼出对话独占一行的网文节奏。</p>
        </section>

        <details class="settings-section" id="voiceConfigSection">
          <summary class="settings-section-title" data-i18n="ui.sec.voice">语音输入</summary>
          <div class="voice-config-form">
            <label class="voice-config-toggle">
              <input type="checkbox" id="voiceEnabledToggle" />
              <span data-i18n="ui.voice.enable">启用语音输入</span>
            </label>
            <div class="voice-config-backend" id="voiceConfigBackend" hidden>
              <p class="voice-config-hint" data-i18n="ui.voice.localHint">识别在本机运行，声音不出设备；加密稿也能用。按住左 Ctrl 说话，或点右下角话筒。</p>
              <label class="voice-config-field">
                <span class="voice-config-label" data-i18n="ui.voice.model">识别模型</span>
                <select id="voiceModelSelect" class="voice-config-select">
                  <option value="local-sensevoice" data-i18n="ui.voice.model.sensevoice">SenseVoice（推荐 · 228 MB · 带标点）</option>
                  <option value="local-zh14m" data-i18n="ui.voice.model.zh14m">极限小杯 zh-14M（30 MB · 流式 · 实验）</option>
                </select>
              </label>
              <div class="voice-pack-row">
                <span class="voice-config-hint" id="voicePackStatus"></span>
                <progress id="voicePackProgress" class="voice-pack-progress" max="1" value="0" hidden></progress>
                <div class="voice-config-actions">
                  <button class="voice-config-save" id="voicePackDownload" type="button" data-i18n="ui.voice.download">下载语音包</button>
                  <button class="voice-config-save" id="voicePackImport" type="button" data-i18n="ui.voice.import">从文件导入…</button>
                  <button class="voice-config-save is-danger" id="voicePackDelete" type="button" data-i18n="ui.voice.delete">删除语音包</button>
                  <input type="file" id="voicePackFile" multiple hidden />
                </div>
              </div>
              <label class="voice-config-field">
                <span class="voice-config-label" data-i18n="ui.voice.source">模型源（可换镜像；字节到手都先校验）</span>
                <input type="url" id="voiceSourceInput" class="voice-config-key" autocomplete="off" spellcheck="false" />
              </label>
              <p class="voice-config-hint" id="voiceAttribution"></p>
            </div>
          </div>
        </details>

        <section class="settings-section is-flat">
          <h3 class="settings-section-title" data-i18n="ui.sec.maintenance">维护</h3>
          <div class="settings-row">
            <button class="auth-action" id="changePasswordButton" type="button" data-i18n="ui.pw.change">更改加密密码…</button>
            <button class="auth-action" id="resetPasswordButton" type="button" data-i18n="ui.pw.reset">忘记密码，重置…</button>
            <button class="auth-action" id="forceUpdateButton" type="button" data-i18n="ui.forceUpdate">强制更新（清缓存重启）</button>
            <button class="auth-action danger" id="factoryResetButton" type="button" data-i18n="ui.factoryReset">还原出厂设置（清本机全部数据）…</button>
            <button class="auth-action" id="diagButton" type="button" data-i18n="ui.diag">诊断日志</button>
          </div>
          <pre id="diagLog" class="diag-log" hidden></pre>
          <div class="settings-build" id="settingsBuild" title="构建版本" data-i18n-title="ui.buildTitle"></div>
        </section>
      </div>

      <div class="drawer-actions" id="drawerActions">
        <button class="drawer-action" id="newDocButton" type="button">
          <svg class="ico" aria-hidden="true"><use href="#new"/></svg>
          <span data-i18n="ui.newDoc">新建</span>
        </button>
        <button class="drawer-action" id="newEncryptedDocButton" type="button">
          <svg class="ico" aria-hidden="true"><use href="#lock"/></svg>
          <span data-i18n="ui.newEncryptedDoc">新建加密稿</span>
        </button>
      </div>
      <p class="drawer-status" id="drawerStatus" hidden></p>
      <div class="drawer-actions hidden" id="trashActions">
        <button class="drawer-action danger" id="emptyTrashButton" type="button">
          <svg class="ico" aria-hidden="true"><use href="#clear-trash"/></svg>
          <span data-i18n="ui.emptyTrash">清空回收站</span>
        </button>
      </div>

      <ul id="docList" class="doc-list" role="list"></ul>
      <p id="docListEmpty" class="doc-list-empty hidden"></p>

      <footer class="drawer-foot">
        <button class="drawer-foot-button" id="openSettingsButton" type="button">
          <svg class="ico" aria-hidden="true"><use href="#settings"/></svg>
          <span data-i18n="ui.settings">设置</span>
        </button>
        <button class="drawer-foot-button" id="openTrashButton" type="button">
          <svg class="ico" aria-hidden="true"><use href="#trash-can"/></svg>
          <span data-i18n="ui.trash">回收站</span>
        </button>
      </footer>
    </aside>

    <script type="module" src="./dist/xiaoheiwu-e0a5d982c261.mjs"></script>
  </body>
</html>
